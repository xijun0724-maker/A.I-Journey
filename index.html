<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com https://openrouter.ai https://cdn.jsdelivr.net; worker-src 'self' https://cdnjs.cloudflare.com;"
    />
    <title>Journey A.I - AI Academic &amp; Task Agent</title>
    <meta
      name="description"
      content="An intelligent academic planning and study assistance system: syllabus analysis, task management, document retrieval and study tutoring."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Journey A.I - AI Academic &amp; Task Agent"
    />
    <meta
      property="og:description"
      content="AI-powered academic planning: syllabus analysis, task management, document retrieval and study tutoring. Runs in your browser with zero server dependencies."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Journey A.I" />
    <meta
      name="twitter:description"
      content="AI-powered academic planning and study assistance system."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 30 Q10 26 16 30 Q22 34 28 30 Q34 26 38 30' stroke='%231d2733' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 28 L14 22 L28 22 L30 28 Z' fill='%231d2733'/%3E%3Cline x1='20' y1='22' x2='20' y2='8' stroke='%231d2733' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M21 9 L21 20 L30 20 Z' fill='%231d2733' opacity='0.7'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Source Serif for brand headings, Plus Jakarta Sans for UI, Geist Mono for code.
     Offline the system serif/sans/mono stack takes over and the layout holds. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/index.css" />
    <!-- Pre-paint theme before first paint (external: CSP has no unsafe-inline). -->
    <script src="src/theme-init.js"></script>
  </head>
  <body>
    <a href="#viewRoot" class="sr-only">Skip to main content</a>
    <div id="app" aria-label="Journey A.I - Academic Planning Assistant">
      <aside class="sidebar" id="sidebar">
        <div class="sb-header">
          <div class="sb-brand">
            <div class="sb-logo" aria-hidden="true" title="Journey A.I">
              <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 30 Q10 26 16 30 Q22 34 28 30 Q34 26 38 30" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                <path d="M2 34 Q8 30 14 34 Q20 38 26 34 Q32 30 38 34" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>
                <path d="M12 28 L14 22 L28 22 L30 28 Z" fill="currentColor" opacity="0.9"/>
                <line x1="20" y1="22" x2="20" y2="8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M21 9 L21 20 L30 20 Z" fill="currentColor" opacity="0.7"/>
                <path d="M19 10 L19 20 L12 20 Z" fill="currentColor" opacity="0.4"/>
                <path d="M20 8 L26 6 L20 4" fill="currentColor" opacity="0.8"/>
              </svg>
            </div>
            <span class="sb-title">Journey A.I</span>
          </div>
          <button class="sb-toggle" id="btnSidebarToggle" aria-label="Collapse sidebar" aria-expanded="true" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
        </div>

        <div class="sb-actions" id="sbActions"></div>

        <nav class="sb-nav" id="navMain" aria-label="Main navigation"></nav>

        <div class="sb-recents" id="sidebarRecent">
          <div class="sb-section-label">Recents</div>
          <div class="sb-recent-list" id="recentChatList"></div>
        </div>

        <div class="sb-footer">
          <!-- Rail-only items (hidden in expanded, visible in collapsed) -->
          <div class="sb-rail-utils">
            <button class="sb-rail-btn" data-act="nav" data-arg="settings" title="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <button class="sb-rail-btn sb-rail-theme" id="btnThemeToggleRail" title="Toggle theme">
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
              </svg>
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
              </svg>
            </button>
          </div>

          <button class="sb-profile" id="btnProfile" aria-label="Account menu" title="Account">
            <div class="sb-avatar">U</div>
            <span class="sb-username">User</span>
            <svg class="sb-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
              <path d="M4.5 6.5 8 10l3.5-3.5"/>
            </svg>
          </button>
          <div class="sb-profile-dropdown" id="profileDropdown">
            <button class="sb-dropdown-item" data-act="nav" data-arg="settings">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
                <path d="M13.3 9.7a1.1 1.1 0 0 0 .2 1.2l.05.05a1.33 1.33 0 1 1-1.88 1.88l-.05-.05a1.1 1.1 0 0 0-1.2-.2 1.1 1.1 0 0 0-.67 1v.12a1.33 1.33 0 1 1-2.66 0v-.06a1.1 1.1 0 0 0-.72-1 1.1 1.1 0 0 0-1.2.2l-.05.05a1.33 1.33 0 1 1-1.88-1.88l.05-.05a1.1 1.1 0 0 0 .2-1.2 1.1 1.1 0 0 0-1-.67h-.12a1.33 1.33 0 1 1 0-2.66h.06a1.1 1.1 0 0 0 1-.72 1.1 1.1 0 0 0-.2-1.2L4.3 3.35a1.33 1.33 0 1 1 1.88-1.88l.05.05a1.1 1.1 0 0 0 1.2.2h.06a1.1 1.1 0 0 0 .67-1V.67a1.33 1.33 0 1 1 2.66 0v.06a1.1 1.1 0 0 0 .67 1 1.1 1.1 0 0 0 1.2-.2l.05-.05a1.33 1.33 0 1 1 1.88 1.88l-.05.05a1.1 1.1 0 0 0-.2 1.2v.06a1.1 1.1 0 0 0 1 .67h.12a1.33 1.33 0 1 1 0 2.66h-.06a1.1 1.1 0 0 0-1 .67z"/>
              </svg>
              Settings
            </button>
            <button class="sb-dropdown-item" id="btnThemeToggle">
              <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" width="14" height="14" aria-hidden="true">
                <circle cx="8" cy="8" r="3"/><line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="1" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="15" y2="8"/><line x1="3.1" y1="3.1" x2="4.5" y2="4.5"/><line x1="11.5" y1="11.5" x2="12.9" y2="12.9"/><line x1="3.1" y1="12.9" x2="4.5" y2="11.5"/><line x1="11.5" y1="4.5" x2="12.9" y2="3.1"/>
              </svg>
              <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" width="14" height="14" aria-hidden="true">
                <path d="M13 9.5A6 6 0 0 1 6.5 3 6 6 0 1 0 13 9.5z"/>
              </svg>
              <span>Dark mode</span>
            </button>
          </div>
        </div>
      </aside>

      <main class="main">
        <div id="viewRoot" tabindex="-1">
          <noscript>
            <div class="u-ns-panel">
              <p><strong>Journey A.I</strong> requires JavaScript to run.</p>
              <p class="u-ns-p">Please enable JavaScript in your browser settings.</p>
            </div>
          </noscript>
          <div id="app-loader" class="u-app-loader">
            <div class="u-ta-center">
              <svg width="32" height="32" viewBox="0 0 40 40" fill="none" class="u-loader-logo">
                <path d="M4 30 Q10 26 16 30 Q22 34 28 30 Q34 26 38 30" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                <path d="M12 28 L14 22 L28 22 L30 28 Z" fill="#1d2733" opacity="0.9"/>
                <line x1="20" y1="22" x2="20" y2="8" stroke="#1d2733" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <p class="u-ns-note">Loading Journey A.I...</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="sb-mobile-scrim" id="sbMobileScrim" aria-hidden="true"></div>

    <div id="toasts" class="toast" aria-live="polite" aria-atomic="false" role="status"></div>
    <div
      id="srStatus"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
      role="status"
    ></div>
    <div id="modalRoot" aria-live="polite"></div>

    <!-- Journey A.I entry point - modular ES module version -->
    <script type="module" src="src/main.js"></script>
    <!-- Classic script: SW registration + loader diagnostic. Must run even if
         the module graph fails, so it cannot be type="module" and must not
         import anything. Kept external so script-src can omit 'unsafe-inline'. -->
    <script src="src/boot-fallback.js"></script>
  </body>
</html>
